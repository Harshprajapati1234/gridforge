<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FB58A"/>
      <stop offset="1" stop-color="#0B5E4B"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F2EE"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#F08A00"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#04281F" flood-opacity="0.35"/>
    </filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#5A2E00" flood-opacity="0.40"/>
    </filter>
    <clipPath id="sheetClip"><rect x="232" y="222" width="560" height="580" rx="52"/></clipPath>
  </defs>
  <!-- macOS squircle body (824 x 824 inside 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>
  <!-- sheet -->
  <g filter="url(#sh)">
    <rect x="232" y="222" width="560" height="580" rx="52" fill="url(#sheet)"/>
  </g>
  <g clip-path="url(#sheetClip)">
    <!-- header row -->
    <rect x="232" y="222" width="560" height="112" fill="#0E6B55"/>
    <!-- column header cells -->
    <rect x="232" y="222" width="560" height="112" fill="none"/>
    <!-- grid lines -->
    <g stroke="#9CC9BC" stroke-width="8" stroke-linecap="round">
      <line x1="232" y1="446" x2="792" y2="446"/>
      <line x1="232" y1="558" x2="792" y2="558"/>
      <line x1="232" y1="670" x2="792" y2="670"/>
      <line x1="419" y1="334" x2="419" y2="802"/>
      <line x1="606" y1="334" x2="606" y2="802"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="8">
      <line x1="419" y1="222" x2="419" y2="334"/>
      <line x1="606" y1="222" x2="606" y2="334"/>
    </g>
    <!-- header letters as simple bars -->
    <g fill="#FFFFFF" fill-opacity="0.9">
      <rect x="302" y="262" width="48" height="32" rx="10"/>
      <rect x="489" y="262" width="48" height="32" rx="10"/>
      <rect x="676" y="262" width="48" height="32" rx="10"/>
    </g>
    <!-- data bars -->
    <g fill="#0E6B55" fill-opacity="0.55">
      <rect x="262" y="486" width="120" height="22" rx="11"/>
      <rect x="449" y="486" width="86" height="22" rx="11"/>
      <rect x="262" y="598" width="96" height="22" rx="11"/>
      <rect x="636" y="598" width="110" height="22" rx="11"/>
      <rect x="449" y="710" width="120" height="22" rx="11"/>
      <rect x="262" y="710" width="70" height="22" rx="11"/>
    </g>
  </g>
  <!-- the "module" tile that snaps into the grid -->
  <g filter="url(#sh2)">
    <rect x="574" y="518" width="236" height="216" rx="40" fill="url(#tile)"/>
  </g>
  <rect x="574" y="518" width="236" height="216" rx="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5"/>
  <!-- plus mark on the tile = add a module -->
  <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="round">
    <line x1="692" y1="574" x2="692" y2="678"/>
    <line x1="640" y1="626" x2="744" y2="626"/>
  </g>
</svg>
